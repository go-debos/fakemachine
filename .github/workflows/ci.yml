name: Build and Test

env:
  GITHUB_TAG: ghcr.io/${{ github.repository }}

on:
  push:
    branches-ignore:
      - '*.tmp'
  # Build at 04:00am every Monday
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
  workflow_dispatch:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-go@v7
    - uses: actions/checkout@v7
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15.0

  man-page:
    name: Generate man page
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Generate man page
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

        # Check the man page can be generated
        cd doc/man/ && ./create_manpage.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        # Currently nested virtualisation (hence kvm) is not supported on GitHub
        # actions; but the qemu backend is enough to test Fakemachine
        # functionality without hardware acceleration since the majority of code
        # is shared between the qemu and kvm backends.
        # See https://github.com/actions/runner-images/issues/183
        os:
          - arch
          - debian-trixie
          - debian-forky
          - ubuntu-questing
          - fedora-latest
        backend:
          - qemu
          - kvm
          # unprivileged user namespaces are blocked by the default container
          # seccomp/AppArmor profiles and masked /proc paths
          - unshare
    name: Test ${{matrix.os}} with ${{matrix.backend}} backend
    runs-on: 'ubuntu-latest'
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/go-debos/test-containers/${{matrix.os}}:main
      options: >-
        --security-opt label=disable
        --cap-add=SYS_PTRACE
        --tmpfs /scratch:exec
        ${{ matrix.backend == 'kvm' && '--device /dev/kvm' || '' }}
        ${{ matrix.backend == 'unshare' && '--privileged' || '' }}
    env:
      TMP: /scratch
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Set safe directory in container
      run: /usr/bin/git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Define fakemachine version
      run: echo "FAKEMACHINE_VER=$(git describe --always --tags HEAD)" >> "$GITHUB_ENV"

    - name: Test build
      run: go build -ldflags="-X main.Version=${FAKEMACHINE_VER}" ./cmd/fakemachine

    - name: Print fakemachine version
      run: ./fakemachine --version

    # pivot_root and newuidmap/newgidmap are in separate packages on Debian and
    # Ubuntu; Arch and Fedora ship them in util-linux and shadow(-utils)
    - name: Install unshare backend dependencies
      if: matrix.backend == 'unshare' && (startsWith(matrix.os, 'debian') || startsWith(matrix.os, 'ubuntu'))
      run: apt-get update && apt-get install -y --no-install-recommends util-linux-extra uidmap

    # The Arch and Fedora images lack hostname(1), which sets the machine's
    # hostname when not running as root
    - name: Install hostname (Arch)
      if: matrix.backend == 'unshare' && matrix.os == 'arch'
      run: pacman -Sy --noconfirm inetutils

    - name: Install hostname (Fedora)
      if: matrix.backend == 'unshare' && startsWith(matrix.os, 'fedora')
      run: dnf install -y hostname

    - name: Run unit tests (${{matrix.backend}} backend)
      run: go test -v -timeout 20m ./... --backend=${{matrix.backend}} | tee test.out

    # The job runs as root, where the unshare backend maps every id through;
    # run again as a user so the subordinate id path is tested too. The
    # runner's AppArmor policy denies unprivileged user namespaces any
    # capability; the container is privileged so it can lift that
    - name: Run unit tests (unshare backend, non-root)
      if: matrix.backend == 'unshare'
      run: |
        if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
          echo 0 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns
        fi
        useradd -m fmtest
        grep -q '^fmtest:' /etc/subuid || echo 'fmtest:100000:65536' >> /etc/subuid
        grep -q '^fmtest:' /etc/subgid || echo 'fmtest:100000:65536' >> /etc/subgid
        chmod 1777 /scratch
        chown -R fmtest "$GITHUB_WORKSPACE"
        runuser -u fmtest -- env PATH="$PATH" HOME=/home/fmtest TMP=/scratch \
          GOCACHE=/scratch/go-cache GOPATH=/scratch/go \
          go test -v ./... --backend=unshare

  test-name-resolution-without-resolved:
    # fakemachine should work on hosts without systemd-resolved, falling back to
    # generating /etc/resolv.conf from the DHCP lease. Uninstall systemd-resolved
    # and check name resolution still works.
    name: Test name resolution without systemd-resolved
    runs-on: 'ubuntu-latest'
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/go-debos/test-containers/debian-trixie:main
      options: >-
        --security-opt label=disable
        --cap-add=SYS_PTRACE
        --tmpfs /scratch:exec
    env:
      TMP: /scratch
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Set safe directory in container
      run: /usr/bin/git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Uninstall systemd-resolved
      run: |
        apt-get remove -y systemd-resolved

    - name: Run DNS resolution test (qemu backend)
      run: go test -v -run TestNetworkDNS ./... --backend=qemu | tee test.out

  # incusd can't run inside the test containers, so test on the runner itself
  test-incus:
    name: Test ubuntu-latest with incus backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Map the runner user to root in the machine, so the raw.idmap path is
    # tested rather than shifted volumes
    - name: Install and set up incus
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends incus
        echo "root:$(id -u):1" | sudo tee -a /etc/subuid
        echo "root:$(id -g):1" | sudo tee -a /etc/subgid
        sudo systemctl restart incus
        sudo incus admin init --minimal
        sudo usermod -aG incus-admin "$USER"
        # Docker's FORWARD policy drops the traffic of the incus bridge
        sudo iptables -P FORWARD ACCEPT

    - name: Run unit tests (incus backend)
      run: sg incus-admin -c "go test -v ./... --backend=incus"

  build-container:
    name: Build Docker container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - golangci
      - test
      - test-incus
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: tree:0

    - name: Set safe directory in container
      run: /usr/bin/git config --global --add safe.directory ${GITHUB_WORKSPACE}

    - name: Define fakemachine version
      run: echo "FAKEMACHINE_VER=$(git describe --always --tags HEAD)" >> "$GITHUB_ENV"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.GITHUB_TAG }}
        tags: |
          "type=ref,event=branch"
          "type=ref,suffix=-{{sha}},event=branch"
          "type=ref,suffix=-{{date 'YYYYMMDD'}},event=branch"
          "type=ref,event=tag"
          "type=ref,event=pr"

    - name: Build & Push Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        # PR workflows do not have permission to publish GHCR images
        push: ${{ github.event_name != 'pull_request' }}
        pull: true
        file: Dockerfile
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: FAKEMACHINE_VER=${{ env.FAKEMACHINE_VER }}

  # Job to key success status against
  allgreen:
    name: allgreen
    if: always()
    needs:
      - golangci
      - man-page
      - test
      - test-incus
      - build-container
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  # Keep workflow alive
  # See https://docs.github.com/en/actions/learn-github-actions/usage-limits-billing-and-administration#disabling-and-enabling-workflows
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs:
      - allgreen
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1

  # Notify on job failure
  notify-on-failure:
    runs-on: ubuntu-latest
    needs:
      - allgreen
    if: >-
     ${{
         always() &&
         needs.allgreen.result == 'failure' &&
         github.event_name == 'schedule' &&
         github.repository == 'go-debos/fakemachine'
      }}
    steps:
      - name: Create or update failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            /* Reuse a single issue to avoid spam */
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open "Scheduled CI job failed"`
            });
            const body = [
              `### Scheduled CI job failed`,
              `- Workflow: ${process.env.GITHUB_WORKFLOW}`,
              `- Run: ${context.runId}`,
              `- Commit: ${process.env.GITHUB_SHA}`,
              `- Branch/Ref: ${process.env.GITHUB_REF}`,
              `- URL: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              ``,
              `Please investigate and close this issue once fixed.`
            ].join("\n");

            if (search.data.items.length > 0) {
              const issue = search.data.items[0];
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "Scheduled CI job failed",
                body,
              });
            }
