version: "2"
linters:
  enable:
    - asasalint
    - bodyclose
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gocritic
    - godoclint
    - godot
    - godox
    - goprintffuncname
    - govet
    - ineffassign
    - intrange
    - maintidx
    - makezero
    - mirror
    - misspell
    - modernize
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nonamedreturns
    - predeclared
    - reassign
    - recvcheck
    - revive
    - staticcheck
    - testableexamples
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
  settings:
    cyclop:
      max-complexity: 40
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - al.essio.dev/pkg/shellescape
            - github.com/docker/go-units
            - github.com/go-debos/fakemachine
            - github.com/jessevdk/go-flags
            - github.com/klauspost/compress/zstd
            - github.com/stretchr/testify
            - github.com/surma/gocpio
            - github.com/ulikunitz/xz
            - golang.org/x/sys
    maintidx:
      under: 10
formatters:
  enable:
    - gofumpt
    - goimports
